<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a5c6e">
  <title>NgalSo · Pratica Tibetana</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    /* ---------- NUOVA PALETTA COLORI (Ispirata ai tuoi RGB Adobe) ---------- */
    :root {
      --bg-page: #FCF9F2;        /* Crema caldo */
      --surface: #FFFFFF;
      --surface-soft: #F4F0E6;
      --primary-deep: #1F4E6E;   /* Blu profondo per testi e header (R:0.147 G:0.259 B:0.519) */
      --primary-ngalso: #3A7B5C; /* Verde NgalSo per bottoni attivi (R:0.337 G:0.595 B:0.401) */
      --gold-tibet: #E9B35F;     /* Oro per accenti e dettagli (R:0.860 G:0.728 B:0.318) */
      --gold-light: #F5DEB3;     /* Dorato chiaro per sfondi soft */
      --accent-breath-in: #4A7C59; /* Verde rilassante per inspiro */
      --accent-breath-out: #A15843; /* Rosso/terra per espiro (R:0.596 G:0.179 B:0.203) */
      --accent-breath-hold: #D4AF37; /* Oro per pausa */
      --text-dark: #2C3E4E;
      --text-muted: #6B7B8B;
      --border-light: #E6DED3;
      --shadow-sm: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      --radius-xl: 28px;
      --radius-lg: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg-page);
      color: var(--text-dark);
      padding: 18px 16px 32px;
      min-height: 100vh;
    }

    .app {
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header & Streak */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary-deep);
      font-weight: 700;
      font-size: 22px;
    }
    .logo svg {
      width: 38px;
      height: 38px;
      stroke: var(--primary-ngalso);
    }
    .streak-badge {
      background: var(--surface);
      padding: 8px 16px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-ngalso);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Navigazione */
    .main-nav {
      display: flex;
      gap: 8px;
      background: var(--surface);
      padding: 6px;
      border-radius: 60px;
      box-shadow: var(--shadow-sm);
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 8px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: var(--primary-ngalso);
      color: white;
      box-shadow: 0 2px 8px rgba(58, 123, 92, 0.3);
    }

    /* Layout card */
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }
    .preset-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .preset-btn, .emergency-btn {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 60px;
      padding: 12px;
      font-weight: 600;
      color: var(--primary-deep);
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn:hover, .emergency-btn:hover {
      background: var(--gold-light);
      border-color: var(--gold-tibet);
    }

    /* Timer */
    .timer-circle {
      position: relative;
      width: 200px;
      margin: 0 auto 20px;
      aspect-ratio: 1;
    }
    .timer-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .timer-ring-bg { fill: none; stroke: #E9E0D4; stroke-width: 10; }
    .timer-ring-progress { fill: none; stroke: var(--primary-ngalso); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 596.9; stroke-dashoffset: 596.9; transition: stroke-dashoffset 0.2s linear; }
    .timer-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .timer-display { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--primary-deep); }
    .timer-controls { display: flex; gap: 12px; margin-top: 8px; }
    .btn-primary, .btn-secondary {
      flex: 1; padding: 12px; border-radius: 60px; font-weight: 600; border: none; cursor: pointer;
    }
    .btn-primary { background: var(--primary-ngalso); color: white; }
    .btn-secondary { background: var(--surface-soft); border: 1px solid var(--border-light); color: var(--text-dark); }

    /* Live Guide */
    .live-guide {
      background: var(--surface-soft);
      border-radius: var(--radius-lg);
      padding: 20px;
      border-left: 6px solid var(--gold-tibet);
    }
    .guide-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--primary-ngalso); margin-bottom: 12px; }
    .live-guide h3 { font-size: 20px; margin-bottom: 8px; }
    .live-guide p { color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }

    /* Sezione Visualizzazione Sacra (ex karaoke) */
    .sacred-display {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px;
      margin: 16px 0 12px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.02), 0 5px 12px rgba(0,0,0,0.03);
    }
    .mantra-sacred-text {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      font-family: 'Courier New', 'Inter monospace', monospace;
      background: #FCF8F0;
      padding: 24px 16px;
      border-radius: 32px;
      color: var(--primary-deep);
      text-align: center;
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.6;
      margin-bottom: 20px;
      border: 1px solid var(--border-light);
    }
    .word-highlight {
      display: inline-block;
      background: var(--primary-ngalso);
      color: white;
      padding: 2px 8px;
      border-radius: 30px;
      transition: all 0.1s ease;
      margin: 0 1px;
    }
    /* Colori per respiro */
    .breath-in .word-highlight { background: var(--accent-breath-in); color: white; box-shadow: 0 0 0 2px rgba(74,124,89,0.3); }
    .breath-out .word-highlight { background: var(--accent-breath-out); color: white; box-shadow: 0 0 0 2px rgba(161,88,67,0.2); }
    .breath-hold .word-highlight { background: var(--accent-breath-hold); color: #2C3E4E; box-shadow: 0 0 0 2px rgba(212,175,55,0.2); }

    .reps-counter { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-weight: 600; }
    .breath-sync {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }
    .breath-arrow {
      font-size: 32px;
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      color: var(--primary-ngalso);
    }
    .breath-text { font-size: 14px; font-weight: 500; color: var(--text-muted); }

    .info-btn { background: none; border: none; font-size: 18px; cursor: pointer; margin-left: 8px; vertical-align: middle; color: var(--gold-tibet); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
    .modal.show { visibility: visible; opacity: 1; }
    .modal-content { background: white; max-width: 85%; padding: 24px; border-radius: 32px; max-height: 70vh; overflow: auto; }
    .close-modal { margin-top: 20px; background: var(--primary-ngalso); color: white; border: none; padding: 8px 24px; border-radius: 40px; }

    .settings-row { display: flex; gap: 12px; align-items: center; }
    select { flex: 2; padding: 12px; border-radius: 60px; border: 1px solid var(--border-light); background: var(--surface); }
    .small-btn { padding: 8px 20px; border-radius: 60px; background: var(--surface); border: 1px solid var(--border-light); }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary-deep); color: white; padding: 10px 22px; border-radius: 60px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 1100; font-size: 14px; }
    .toast.show { opacity: 1; }

    .footer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 12px; }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="24" cy="24" r="19"/>
        <path d="M15 27c2.8 5.2 15.2 5.2 18 0M18 25h12M20 21h8M24 13v8" stroke-linecap="round"/>
      </svg>
      <span>NgalSo</span>
    </div>
    <div class="streak-badge"><span>🔥</span><span id="streakCount">0</span><span>giorni</span></div>
  </header>

  <nav class="main-nav">
    <button class="nav-btn active" data-tab="practice">🧘 Pratica</button>
    <button class="nav-btn" data-tab="moon">🌙 Luna</button>
    <button class="nav-btn" data-tab="journal">📓 Diario</button>
  </nav>

  <!-- TAB PRATICA -->
  <div id="tab-practice" class="tab-panel active" style="display: flex; flex-direction: column; gap: 18px;">
    <div class="preset-row">
      <button class="preset-btn" data-preset="morning-5">🌅 Mattina · 5min</button>
      <button class="preset-btn" data-preset="morning-10">🌅 Mattina · 10min</button>
      <button class="preset-btn" data-preset="evening-5">🌙 Sera · 5min</button>
      <button class="preset-btn" data-preset="evening-10">🌙 Sera · 10min</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom: 12px;">⚡ Pratiche di ricentro</h3>
      <div style="display: flex; gap: 12px;">
        <button class="emergency-btn" data-emergency="1min">🌀 1 min – Scarico</button>
        <button class="emergency-btn" data-emergency="2min">❤️ 2 min – Ritorno al cuore</button>
      </div>
    </div>

    <div class="card">
      <div class="timer-circle">
        <svg class="timer-ring" viewBox="0 0 240 240">
          <circle class="timer-ring-bg" cx="120" cy="120" r="95"></circle>
          <circle class="timer-ring-progress" id="timerRingProgress" cx="120" cy="120" r="95"></circle>
        </svg>
        <div class="timer-center">
          <div class="timer-display" id="timerDisplay">05:00</div>
          <span id="timerPhaseLabel">Pratica</span>
        </div>
      </div>
      <div class="timer-controls">
        <button id="startTimerBtn" class="btn-primary">▶ Avvia</button>
        <button id="pauseTimerBtn" class="btn-secondary">⏸ Pausa</button>
        <button id="resetTimerBtn" class="btn-secondary">⟳ Reset</button>
      </div>
    </div>

    <div class="live-guide" id="liveGuide">
      <div class="guide-header"><span id="stepCounter">Passo 1/4</span><span id="stepTimer">0:00</span></div>
      <h3 id="stepTitle">Rifugio</h3>
      <p id="stepText">Recita il rifugio tre volte...</p>

      <!-- Visualizzazione sacra del mantra (parola per parola con respiro) -->
      <div id="sacredArea" style="display: none;">
        <div class="sacred-display">
          <div class="reps-counter">
            <span>🔁 <span id="currentRep">0</span>/<span id="targetReps">0</span></span>
            <button id="mantraInfoBtn" class="info-btn" title="Pronuncia e significato">ℹ️</button>
          </div>
          <div id="sacredMantraText" class="mantra-sacred-text"> </div>
          <div class="breath-sync">
            <span>🌬️</span>
            <span id="breathArrowIcon" class="breath-arrow">↓</span>
            <span id="breathStateLabel">Inspiro</span>
            <span>🧘</span>
          </div>
        </div>
      </div>
      <div class="next-preview" id="nextPreview"></div>
    </div>
    <div class="settings-row">
      <select id="bellSelect">
        <option value="both">🔔 Campana inizio/fine</option>
        <option value="end">🔕 Solo fine</option>
        <option value="silent">🔇 Silenzioso</option>
      </select>
      <button id="testBellBtn" class="small-btn">Prova campana</button>
    </div>
  </div>

  <!-- TAB LUNA (semplice) -->
  <div id="tab-moon" class="tab-panel" style="display: none; gap: 18px;">
    <div class="card" style="background: linear-gradient(125deg, #1F4E6E, #2a5c6e); color: white; display: flex; gap: 16px; align-items: center;">
      <div id="moonIcon" style="font-size: 52px;">🌕</div>
      <div><h3 id="moonPhaseName">Luna piena</h3><p id="moonAdvice">Giorno favorevole per i precetti</p></div>
    </div>
    <div class="card" id="moonPracticeCard"></div>
    <div class="card" id="preceptsCard" style="display: none;"><h3>📜 8 precetti Mahayana</h3><div id="preceptsList"></div></div>
  </div>

  <!-- TAB DIARIO -->
  <div id="tab-journal" class="tab-panel" style="display: none; gap: 18px;">
    <div class="card">
      <label>Prima</label><br>
      <div style="display: flex; gap: 8px; margin: 8px 0;">
        <button class="mood-btn" data-mood="calmo">😌 Calmo</button>
        <button class="mood-btn" data-mood="stanco">😴 Stanco</button>
        <button class="mood-btn" data-mood="agitato">😤 Agitato</button>
      </div>
      <input type="hidden" id="moodBefore" value="calmo">
      <label>Dopo</label>
      <div style="display: flex; gap: 8px; margin: 8px 0;">
        <button class="mood-after" data-after="leggero">🕊️ Leggero</button>
        <button class="mood-after" data-after="centrato">🎯 Centrato</button>
      </div>
      <input type="hidden" id="moodAfter" value="leggero">
      <textarea id="journalNote" rows="2" placeholder="Nota (opzionale)..." style="width:100%; margin:12px 0; border-radius: 20px; padding: 12px; border:1px solid #E6DED3;"></textarea>
      <button id="saveJournalBtn" class="btn-primary">💾 Salva e completa pratica</button>
    </div>
    <div class="card"><h4>📋 Storico</h4><div id="sessionHistory"></div><button id="exportDataBtn" class="small-btn" style="margin-top:12px;">📤 Esporta</button></div>
  </div>
  <footer class="footer">NgalSo · Tradizione tibetana · guida al ritmo</footer>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-content"><div id="modalMessage"></div><button class="close-modal">Chiudi</button></div></div>

<script>
  // ---------- STORAGE ----------
  const storage = {
    get(k, def = null) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch { return def; } },
    set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  };

  // ---------- DATI PRATICHE ----------
  const PRACTICE_STEPS_MORNING = [
    { title: "Rifugio", text: "NAMO GURU BYE · NAMO BUDDHAYA · NAMO DHARMAYA · NAMO SANGHAYA (3x)", mantra: "NAMO GURU BYE NAMO BUDDHAYA NAMO DHARMAYA NAMO SANGHAYA", reps: 3, meaning: "Mi rifugio nel Guru, nel Buddha, nel Dharma, nel Sangha.", pronunciation: "nah-moh goo-roo bye, nah-moh boo-dah-yah" },
    { title: "Bodhicitta", text: "Per il beneficio di tutti gli esseri.", mantra: "OM BODHICITTA HUNG", reps: 3, meaning: "Risveglio la mente compassionevole.", pronunciation: "om bo-dhi-chit-ta hung" },
    { title: "Mantra cuore", text: "Compassione universale.", mantra: "OM MANI PEME HUNG", reps: 21, meaning: "Il mantra di Avalokiteshvara.", pronunciation: "om ma-ni pe-me hung" },
    { title: "Dedica", text: "Possa questo merito portare pace.", mantra: "", reps: 0 }
  ];
  const PRACTICE_STEPS_EVENING = [
    { title: "Scarico", text: "Espira tensioni, inspira calma.", mantra: "OM AH HUNG", reps: 7, meaning: "Purifica corpo, parola e mente.", pronunciation: "om ah hung" },
    { title: "Purificazione elementi", text: "EH YAM RAM LAM BAM · HO SHUDDHE SHUDDHE SOHA", mantra: "EH YAM RAM LAM BAM HO SHUDDHE SHUDDHE SOHA", reps: 5, meaning: "Armonizza i 5 elementi.", pronunciation: "e yam ram lam bam ho sciud-de sciud-de so-ha" },
    { title: "Mantra cuore", text: "Lascia andare.", mantra: "OM MANI PEME HUNG", reps: 21 },
    { title: "Dedica", text: "Che tutti gli esseri siano felici.", mantra: "", reps: 0 }
  ];
  const EMERGENCY = {
    "1min": { name: "Scarico rapido", duration: 1, steps: [ { title: "Respiro OM AH HUNG", text: "Inspira OM, espira HUNG.", mantra: "OM AH HUNG", reps: 3, meaning: "Pulisce mente e corpo.", pronunciation: "om ah hung" }, { title: "Dedica", text: "Pace ora.", mantra: "", reps: 0 } ] },
    "2min": { name: "Ritorno al cuore", duration: 2, steps: [ { title: "Rifugio", text: "NAMO GURU BYE", mantra: "NAMO GURU BYE", reps: 1 }, { title: "Mantra cuore", text: "Apri il cuore.", mantra: "OM MANI PEME HUNG", reps: 7 }, { title: "Dedica", text: "Gentilezza per tutti.", mantra: "", reps: 0 } ] }
  };

  let currentPractice = { type: "morning", duration: 5, steps: PRACTICE_STEPS_MORNING, name: "Mattina" };
  let currentStep = 0, timerRemaining = 300, timerTotal = 300, timerRunning = false, timerInterval = null;
  // gestione parola per parola e respiro
  let sacredInterval = null;
  let wordsArray = [];
  let currentWordIdx = 0;
  let currentRepetition = 0;
  let targetReps = 0;
  let currentMantraMeaning = "", currentMantraPron = "";
  let breathCycle = ["in", "hold", "out", "hold"]; // durata in ms 4000,1500,4000,1500
  let breathStep = 0;
  let breathTimer = null;

  function toast(msg) { let t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
  function playBell(kind) { try { let a = new Audio(`audio/${kind === 'start' ? 'bell-start' : 'bell-interval'}.mp3`); a.volume = 0.4; a.play().catch(()=>{}); } catch(e){} }

  function updateTimerDisplay() {
    let mins = Math.floor(timerRemaining / 60), secs = timerRemaining % 60;
    document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    let progress = (timerTotal - timerRemaining) / timerTotal;
    let circum = 2 * Math.PI * 95;
    let offset = circum * (1 - progress);
    document.getElementById('timerRingProgress').style.strokeDashoffset = offset;
  }

  // respiro sincronizzato con parola e freccia
  function updateBreathVisual(phase) {
    const arrow = document.getElementById('breathArrowIcon');
    const labelSpan = document.getElementById('breathStateLabel');
    if (!arrow) return;
    if (phase === 'in') {
      arrow.style.transform = 'translateY(0px)';
      arrow.innerHTML = '↓';
      if(labelSpan) labelSpan.innerText = 'Inspiro';
      document.getElementById('sacredMantraText')?.parentElement?.parentElement?.classList.remove('breath-out','breath-hold');
      document.getElementById('sacredMantraText')?.parentElement?.parentElement?.classList.add('breath-in');
    } else if (phase === 'out') {
      arrow.style.transform = 'translateY(-12px)';
      arrow.innerHTML = '↑';
      if(labelSpan) labelSpan.innerText = 'Espiro';
      document.getElementById('sacredMantraText')?.parentElement?.parentElement?.classList.remove('breath-in','breath-hold');
      document.getElementById('sacredMantraText')?.parentElement?.parentElement?.classList.add('breath-out');
    } else {
      arrow.style.transform = 'translateY(-6px)';
      arrow.innerHTML = '◌';
      if(labelSpan) labelSpan.innerText = 'Pausa';
      document.getElementById('sacredMantraText')?.parentElement?.parentElement?.classList.remove('breath-in','breath-out');
      document.getElementById('sacredMantraText')?.parentElement?.parentElement?.classList.add('breath-hold');
    }
  }

  function startBreathCycle() {
    if(breathTimer) clearInterval(breathTimer);
    breathStep = 0;
    const intervals = [4000, 1500, 4000, 1500]; // inspiro, trattenuto, espiro, trattenuto
    function runStep() {
      let phase = breathStep === 0 ? 'in' : (breathStep === 2 ? 'out' : 'hold');
      updateBreathVisual(phase);
      breathStep = (breathStep + 1) % 4;
      breathTimer = setTimeout(runStep, intervals[(breathStep+3)%4]); // next
    }
    runStep();
  }

  function stopSacred() {
    if(sacredInterval) clearInterval(sacredInterval);
    if(breathTimer) clearTimeout(breathTimer);
    document.getElementById('sacredArea').style.display = 'none';
  }

  // Avanza parola per parola
  function startWordByWord(step) {
    if(!step.mantra || step.reps === 0) return;
    stopSacred();
    const fullMantra = step.mantra.trim();
    wordsArray = fullMantra.split(/\s+/).filter(w => w.length > 0);
    targetReps = step.reps;
    currentRepetition = 0;
    currentWordIdx = 0;
    currentMantraMeaning = step.meaning || "Mantra di trasformazione";
    currentMantraPron = step.pronunciation || "Ascolta dal maestro";

    document.getElementById('targetReps').innerText = targetReps;
    document.getElementById('currentRep').innerText = "0";
    document.getElementById('sacredArea').style.display = 'block';
    renderSacredText();

    const stepDurationSec = (timerTotal / currentPractice.steps.length); // secondi per passo
    const totalWords = wordsArray.length * targetReps;
    const intervalMs = (stepDurationSec * 1000) / totalWords;
    startBreathCycle();

    sacredInterval = setInterval(() => {
      if(!timerRunning) return;
      // avanzamento parola
      currentWordIdx++;
      if(currentWordIdx >= wordsArray.length) {
        currentWordIdx = 0;
        currentRepetition++;
        document.getElementById('currentRep').innerText = currentRepetition;
        if(currentRepetition >= targetReps) {
          clearInterval(sacredInterval);
          stopSacred();
          nextStep(); // passa allo step successivo
          return;
        }
      }
      renderSacredText();
    }, intervalMs);
  }

  function renderSacredText() {
    const container = document.getElementById('sacredMantraText');
    if(!container) return;
    let html = '';
    for(let i=0; i<wordsArray.length; i++) {
      let word = wordsArray[i];
      if(i === currentWordIdx) html += `<span class="word-highlight">${word}</span> `;
      else html += `${word} `;
    }
    container.innerHTML = html.trim();
  }

  function nextStep() {
    if(currentStep+1 < currentPractice.steps.length) {
      currentStep++;
      updateLiveGuide();
    } else {
      completePractice();
    }
  }

  function completePractice() {
    pauseTimer();
    playBell('start');
    let sessions = storage.get('ngalso_sessions',{});
    sessions[new Date().toISOString().split('T')[0]] = { completed:true, name: currentPractice.name };
    storage.set('ngalso_sessions', sessions);
    updateStreak(true);
    toast('✨ Pratica completata ✨');
    resetTimer();
  }

  function updateLiveGuide() {
    const step = currentPractice.steps[currentStep];
    document.getElementById('stepCounter').innerText = `Passo ${currentStep+1}/${currentPractice.steps.length}`;
    document.getElementById('stepTitle').innerText = step.title;
    document.getElementById('stepText').innerText = step.text;
    if(step.mantra && step.reps > 0) startWordByWord(step);
    else stopSacred();
    const next = currentPractice.steps[currentStep+1];
    document.getElementById('nextPreview').innerHTML = next ? `⏭️ Prossimo: ${next.title}` : '🎉 Ultimo passo – dedica';
  }

  function timerTick() {
    if(timerRemaining <= 0) { completePractice(); return; }
    timerRemaining--;
    updateTimerDisplay();
    let stepDuration = timerTotal / currentPractice.steps.length;
    let stepIndex = Math.floor((timerTotal - timerRemaining) / stepDuration);
    if(stepIndex !== currentStep && stepIndex < currentPractice.steps.length) {
      currentStep = stepIndex;
      updateLiveGuide();
    }
  }

  function startTimer() { if(timerRunning) return; timerRunning=true; if(document.getElementById('bellSelect').value !== 'silent') playBell('start'); timerInterval = setInterval(timerTick,1000); }
  function pauseTimer() { timerRunning=false; clearInterval(timerInterval); timerInterval=null; }
  function resetTimer() { pauseTimer(); timerRemaining = timerTotal; currentStep=0; updateTimerDisplay(); updateLiveGuide(); }
  function setPractice(type, duration, customSteps=null) {
    if(customSteps) currentPractice = { type, duration, steps: customSteps, name: customSteps[0]?.title || "Pratica" };
    else currentPractice = { type, duration, steps: type==='morning' ? PRACTICE_STEPS_MORNING : PRACTICE_STEPS_EVENING, name: type==='morning' ? 'Mattina' : 'Sera' };
    timerRemaining = duration*60; timerTotal = duration*60; currentStep=0; updateTimerDisplay(); updateLiveGuide(); pauseTimer();
    document.getElementById('timerPhaseLabel').innerText = `${currentPractice.name} · ${duration}min`;
    storage.set('ngalso_last_practice',{type,duration});
  }
  function updateStreak(save=false) { let s=storage.get('ngalso_sessions',{}); let streak=0; let d=new Date(); while(true){ let k=d.toISOString().split('T')[0]; if(s[k]?.completed) streak++; else break; d.setDate(d.getDate()-1); } document.getElementById('streakCount').innerText=streak; }

  // Luna e diario (semplici)
  function renderMoon() { let age = (Date.now() - Date.UTC(2000,0,6,18,14))/86400000%29.53; let phase = age<1.2?'new':(age<6.8?'waxing':(age<8.2?'first':(age<13.6?'gibbousWax':(age<16?'full':(age<21?'gibbousWane':(age<23?'last':'waning')))))); let name = { new:'🌑 Luna nuova', first:'🌓 Primo quarto', full:'🌕 Luna piena', last:'🌗 Ultimo quarto' }[phase] || '🌒 Luna crescente'; document.getElementById('moonPhaseName').innerHTML = name; document.getElementById('moonAdvice').innerHTML = (phase==='new'||phase==='full')?'Oggi favorevole per gli 8 precetti':'Pratica base NgalSo'; let preDiv=document.getElementById('preceptsCard'); if(phase==='new'||phase==='full'){ preDiv.style.display='block'; document.getElementById('preceptsList').innerHTML = ["Non uccidere","Non rubare","Astinenza","Non mentire","No intossicanti","Non mangiare dopo mezzogiorno","No letti alti","No ornamenti"].map(l=>`<div>${l}</div>`).join(''); } else preDiv.style.display='none'; document.getElementById('moonPracticeCard').innerHTML = `<button class="btn-primary" id="moonStart">🧘 Avvia pratica consigliata</button>`; document.getElementById('moonStart')?.addEventListener('click',()=>setPractice('morning', phase==='new'?30:15)); }
  function renderJournal() { let e=storage.get('ngalso_journal',[]); document.getElementById('sessionHistory').innerHTML = e.slice(0,8).map(e=>`<div>${new Date(e.date).toLocaleDateString()} · ${e.moodBefore} → ${e.moodAfter}</div>`).join('') || '<div>Nessuna nota</div>'; }
  function saveJournal() { let before=document.getElementById('moodBefore').value, after=document.getElementById('moodAfter').value, note=document.getElementById('journalNote').value; let j=storage.get('ngalso_journal',[]); j.unshift({date:new Date().toISOString(), moodBefore:before, moodAfter:after, note, practice:currentPractice.name}); storage.set('ngalso_journal',j.slice(0,100)); renderJournal(); toast('Diario salvato'); document.getElementById('journalNote').value=''; }
  function exportData() { let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(storage.get('ngalso_sessions',{}))],{type:'application/json'})); a.download=`ngalso_${new Date().toISOString().slice(0,10)}.json`; a.click(); }

  function showMantraInfo() { let msg = `<strong>Pronuncia:</strong> ${currentMantraPron}<br><br><strong>Significato:</strong> ${currentMantraMeaning}`; document.getElementById('modalMessage').innerHTML = msg; document.getElementById('modal').classList.add('show'); }
  document.querySelector('.close-modal')?.addEventListener('click',()=>document.getElementById('modal').classList.remove('show'));

  function init() {
    let last = storage.get('ngalso_last_practice',{type:'morning',duration:5});
    setPractice(last.type, last.duration);
    document.querySelectorAll('.preset-btn').forEach(btn=>btn.addEventListener('click',()=>{ let [t,d]=btn.dataset.preset.split('-'); setPractice(t,parseInt(d)); }));
    document.querySelectorAll('[data-emergency]').forEach(btn=>btn.addEventListener('click',()=>{ let e=EMERGENCY[btn.dataset.emergency]; if(e) setPractice('emergency', e.duration, e.steps); }));
    document.getElementById('startTimerBtn').onclick=startTimer; document.getElementById('pauseTimerBtn').onclick=pauseTimer; document.getElementById('resetTimerBtn').onclick=resetTimer; document.getElementById('testBellBtn').onclick=()=>playBell('start'); document.getElementById('saveJournalBtn').onclick=saveJournal; document.getElementById('exportDataBtn').onclick=exportData; document.getElementById('mantraInfoBtn')?.addEventListener('click',showMantraInfo);
    document.querySelectorAll('.mood-btn').forEach(b=>b.addEventListener('click',()=>{ document.getElementById('moodBefore').value=b.dataset.mood; document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }));
    document.querySelectorAll('.mood-after').forEach(b=>b.addEventListener('click',()=>{ document.getElementById('moodAfter').value=b.dataset.after; document.querySelectorAll('.mood-after').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }));
    document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{ let tab=b.dataset.tab; document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none'); document.getElementById(`tab-${tab}`).style.display='flex'; document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); if(tab==='moon') renderMoon(); if(tab==='journal') renderJournal(); }));
    renderMoon(); renderJournal(); updateStreak();
    toast('🙏 Pratica NgalSo · guida al respiro e ritmo');
  }
  init();
</script>
</body>
</html>
