<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Il Cammino verso il Nirvana</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- SCHERMATA HOME -->
  <div id="schermata-home" class="schermata attiva">
    <div class="header">
      <div class="loto">☸️</div>
      <h1>Il Cammino<br/><span>verso il Nirvana</span></h1>
      <p class="sottotitolo">Ogni respiro è un passo</p>
    </div>

    <div class="card-menu">
      <button class="btn-menu" onclick="mostraSchermata('schermata-medita')">
        <span class="icona">🧘</span>
        <span class="testo-btn">Medita Ora</span>
      </button>
      <button class="btn-menu" onclick="mostraSchermata('schermata-mantra')">
        <span class="icona">📿</span>
        <span class="testo-btn">I Mantra</span>
      </button>
      <button class="btn-menu" onclick="mostraSchermata('schermata-suoni')">
        <span class="icona">🎵</span>
        <span class="testo-btn">Suoni e Musica</span>
      </button>
      <button class="btn-menu" onclick="mostraSchermata('schermata-sessioni')">
        <span class="icona">📊</span>
        <span class="testo-btn">Le Mie Sessioni</span>
      </button>
    </div>

    <div class="frase-giorno">
      <p id="frase-motivazionale"></p>
    </div>
  </div>

  <!-- SCHERMATA MEDITA -->
  <div id="schermata-medita" class="schermata">
    <div class="top-bar">
      <button class="btn-back" onclick="mostraSchermata('schermata-home')">← Indietro</button>
      <h2>Medita Ora</h2>
    </div>

    <div class="sezione">
      <label class="etichetta">⏱ Durata</label>
      <div class="scelta-durata">
        <button class="btn-durata" onclick="scegliDurata(5)">5'</button>
        <button class="btn-durata" onclick="scegliDurata(10)">10'</button>
        <button class="btn-durata" onclick="scegliDurata(20)">20'</button>
        <button class="btn-durata" onclick="scegliDurata(30)">30'</button>
        <button class="btn-durata" onclick="scegliDurata(45)">45'</button>
        <button class="btn-durata" onclick="scegliDurata(60)">60'</button>
      </div>
    </div>

    <div class="sezione">
      <label class="etichetta">📿 Mantra</label>
      <select id="scelta-mantra" class="select-stile">
        <option value="">-- Nessun mantra --</option>
        <option value="Om Mani Padme Hum">Om Mani Padme Hum</option>
        <option value="Om Namah Shivaya">Om Namah Shivaya</option>
        <option value="Gate Gate Paragate">Gate Gate Paragate</option>
        <option value="Om Shanti Shanti Shanti">Om Shanti Shanti Shanti</option>
        <option value="Namo Amitabha">Namo Amitabha</option>
        <option value="Om Tare Tuttare Ture Soha">Om Tare Tuttare Ture Soha</option>
      </select>
    </div>

    <div class="sezione">
      <label class="etichetta">📝 Note (opzionale)</label>
      <textarea id="note-sessione" class="textarea-stile" 
        placeholder="Come ti senti? Cosa vuoi intenzione per questa sessione..."></textarea>
    </div>

    <!-- TIMER -->
    <div id="area-timer" class="area-timer nascosta">
      <div class="cerchio-timer">
        <span id="display-timer">00:00</span>
      </div>
      <p id="mantra-display" class="mantra-in-corsa"></p>
      <div class="btn-timer-group">
        <button id="btn-pausa" class="btn-oro" onclick="pausaTimer()">⏸ Pausa</button>
        <button class="btn-rosso" onclick="fermaTimer()">⏹ Termina</button>
      </div>
    </div>

    <div id="btn-avvia-wrap">
      <button class="btn-principale" onclick="avviaSessione()">
        🧘 Inizia la Sessione
      </button>
    </div>
  </div>

  <!-- SCHERMATA MANTRA -->
  <div id="schermata-mantra" class="schermata">
    <div class="top-bar">
      <button class="btn-back" onclick="tornaMantra()">← Indietro</button>
      <h2>I Mantra</h2>
    </div>

    <div id="lista-mantra">
      <!-- generata da JS -->
    </div>

    <div id="dettaglio-mantra" class="nascosta">
      <!-- generato da JS -->
    </div>
  </div>

  <!-- SCHERMATA SUONI -->
  <div id="schermata-suoni" class="schermata">
    <div class="top-bar">
      <button class="btn-back" onclick="mostraSchermata('schermata-home')">← Indietro</button>
      <h2>Suoni e Musica</h2>
    </div>

    <div id="lista-suoni">
      <!-- generata da JS -->
    </div>

    <div id="player-youtube" class="player-wrap nascosta">
      <iframe id="yt-frame" width="100%" height="200"
        src="" frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
      <button class="btn-chiudi-player" onclick="chiudiPlayer()">✕ Chiudi Player</button>
    </div>
  </div>

  <!-- SCHERMATA SESSIONI -->
  <div id="schermata-sessioni" class="schermata">
    <div class="top-bar">
      <button class="btn-back" onclick="mostraSchermata('schermata-home')">← Indietro</button>
      <h2>Le Mie Sessioni</h2>
    </div>

    <div id="stats-box" class="stats-box">
      <div class="stat">
        <span id="tot-sessioni">0</span>
        <label>Sessioni</label>
      </div>
      <div class="stat">
        <span id="tot-minuti">0</span>
        <label>Minuti totali</label>
      </div>
      <div class="stat">
        <span id="streak-giorni">0</span>
        <label>Giorni di fila</label>
      </div>
    </div>

    <div id="lista-sessioni">
      <p class="testo-vuoto">Nessuna sessione ancora. Inizia a meditare! 🙏</p>
    </div>
  </div>

  <!-- AUDIO campana -->
  <audio id="campana" src="audio/campana.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>

</body>
</html>
