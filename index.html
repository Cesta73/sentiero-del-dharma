<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A6B5A">
  <meta name="description" content="NgalSo – Meditazione guidata, mantra a tempo e fasi lunari">
  <title>NgalSo · Pratica Tibetana</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #F5F0E8 0%, #EDE5D8 100%);
      color: #2C2418;
      padding: 16px;
      min-height: 100vh;
    }

    .app {
      max-width: 550px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1A6B5A;
      font-weight: 700;
      font-size: 22px;
    }

    .logo svg {
      width: 38px;
      height: 38px;
    }

    .streak-badge {
      background: #D9EFEA;
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      color: #1A6B5A;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* navigazione */
    .main-nav {
      display: flex;
      gap: 8px;
      background: white;
      padding: 6px;
      border-radius: 50px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
    }

    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 600;
      color: #7A6B5A;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn.active {
      background: #1A6B5A;
      color: white;
      box-shadow: 0 2px 6px rgba(26,107,90,0.3);
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .tab-panel.active {
      display: flex;
    }

    /* card generica */
    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .preset-btn, .emergency-btn {
      background: white;
      border: 1px solid #E2D8CC;
      border-radius: 50px;
      padding: 12px;
      font-weight: 600;
      color: #1A6B5A;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover, .emergency-btn:hover {
      background: #D9EFEA;
      border-color: #1A6B5A;
    }

    /* timer */
    .timer-card {
      text-align: center;
    }

    .timer-circle {
      position: relative;
      width: 220px;
      margin: 0 auto 20px;
      aspect-ratio: 1;
    }

    .timer-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-ring-bg {
      fill: none;
      stroke: #E2D8CC;
      stroke-width: 12;
    }

    .timer-ring-progress {
      fill: none;
      stroke: #1A6B5A;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 653.45;
      stroke-dashoffset: 653.45;
      transition: stroke-dashoffset 0.2s linear;
    }

    .timer-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .timer-display {
      font-size: 44px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #1A6B5A;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 50px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #1A6B5A;
      color: white;
    }

    .btn-secondary {
      background: #FAF7F2;
      border: 1px solid #E2D8CC;
      color: #2C2418;
    }

    /* live guide */
    .live-guide {
      background: #FAF7F2;
      border-left: 5px solid #1A6B5A;
      border-radius: 20px;
      padding: 18px;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #1A6B5A;
      margin-bottom: 10px;
    }

    .live-guide h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .live-guide p {
      color: #5A4C3A;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* mantra karaoke */
    .mantra-karaoke {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 16px;
      margin: 12px 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .mantra-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      font-family: monospace;
      background: #F0EDE4;
      padding: 20px 12px;
      border-radius: 20px;
      color: #1A6B5A;
      word-break: break-word;
      white-space: pre-wrap;
      margin-bottom: 16px;
      transition: all 0.1s;
    }

    .karaoke-letter {
      display: inline;
      transition: color 0.05s linear;
    }
    .highlight-letter {
      color: #D4A373;
      background-color: #FFF0E0;
    }

    .reps-counter {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .breath-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 28px;
      color: #1A6B5A;
    }

    .breath-arrow {
      font-size: 32px;
      animation: breatheMove 4s ease-in-out infinite;
    }

    @keyframes breatheMove {
      0% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-12px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.6; }
    }

    .info-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-left: 10px;
      vertical-align: middle;
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal.show {
      visibility: visible;
      opacity: 1;
    }
    .modal-content {
      background: white;
      max-width: 85%;
      padding: 24px;
      border-radius: 32px;
      max-height: 70vh;
      overflow: auto;
    }
    .close-modal {
      margin-top: 16px;
      background: #1A6B5A;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
    }

    /* altri */
    .settings-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      flex: 2;
      padding: 10px;
      border-radius: 40px;
      border: 1px solid #E2D8CC;
    }
    .small-btn {
      padding: 8px 16px;
      border-radius: 40px;
      background: #FAF7F2;
      border: 1px solid #E2D8CC;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #7A6B5A;
      padding: 16px;
    }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #2C2418;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      z-index: 1100;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="24" cy="24" r="19"/>
        <path d="M15 27c2.8 5.2 15.2 5.2 18 0M18 25h12M20 21h8M24 13v8" stroke-linecap="round"/>
      </svg>
      <span>NgalSo</span>
    </div>
    <div class="streak-badge"><span>🔥</span><span id="streakCount">0</span><span>gg</span></div>
  </header>

  <nav class="main-nav">
    <button class="nav-btn active" data-tab="practice">🧘 Pratica</button>
    <button class="nav-btn" data-tab="moon">🌙 Luna & Precetti</button>
    <button class="nav-btn" data-tab="journal">📓 Diario</button>
  </nav>

  <!-- TAB PRATICA -->
  <div id="tab-practice" class="tab-panel active">
    <div class="preset-row">
      <button class="preset-btn" data-preset="morning-5">🌅 Mattina · 5min</button>
      <button class="preset-btn" data-preset="morning-10">🌅 Mattina · 10min</button>
      <button class="preset-btn" data-preset="evening-5">🌙 Sera · 5min</button>
      <button class="preset-btn" data-preset="evening-10">🌙 Sera · 10min</button>
    </div>

    <!-- pratiche d'emergenza -->
    <div class="card">
      <h3 style="margin-bottom: 12px;">⚡ Pratiche d'emergenza</h3>
      <div style="display: flex; gap: 10px;">
        <button class="emergency-btn" data-emergency="1min">🌀 1 min – Scarico rapido</button>
        <button class="emergency-btn" data-emergency="2min">❤️ 2 min – Ritorno al cuore</button>
      </div>
    </div>

    <div class="timer-card card">
      <div class="timer-circle">
        <svg class="timer-ring" viewBox="0 0 240 240">
          <circle class="timer-ring-bg" cx="120" cy="120" r="104"></circle>
          <circle class="timer-ring-progress" id="timerRingProgress" cx="120" cy="120" r="104"></circle>
        </svg>
        <div class="timer-center">
          <div class="timer-display" id="timerDisplay">05:00</div>
          <span id="timerPhaseLabel">Pratica</span>
        </div>
      </div>
      <div class="timer-controls">
        <button id="startTimerBtn" class="btn-primary">▶ Avvia</button>
        <button id="pauseTimerBtn" class="btn-secondary">⏸ Pausa</button>
        <button id="resetTimerBtn" class="btn-secondary">⟳ Reset</button>
      </div>
    </div>

    <div class="live-guide" id="liveGuide">
      <div class="guide-header"><span id="stepCounter">Passo 1/4</span><span id="stepTimer">0:00</span></div>
      <h3 id="stepTitle">Rifugio</h3>
      <p id="stepText">Recita il rifugio tre volte...</p>

      <!-- area karaoke mantra + respiro -->
      <div id="mantraKaraokeArea" style="display: none;">
        <div class="mantra-karaoke">
          <div class="reps-counter">
            <span>🔁 <span id="currentRep">0</span>/<span id="targetReps">0</span></span>
            <button id="mantraInfoBtn" class="info-btn" title="Pronuncia e significato">ℹ️</button>
          </div>
          <div id="karaokeText" class="mantra-text"> </div>
          <div class="breath-icon">
            <span>🌬️</span>
            <span id="breathArrow" class="breath-arrow">↓</span>
            <span>🧘</span>
          </div>
        </div>
      </div>
      <div class="next-preview" id="nextPreview"></div>
    </div>

    <div class="settings-row">
      <select id="bellSelect">
        <option value="both">🔔 Campana inizio/fine</option>
        <option value="end">🔕 Solo fine</option>
        <option value="interval">⏱️ Ogni 5 min + fine</option>
        <option value="silent">🔇 Silenzioso</option>
      </select>
      <button id="testBellBtn" class="small-btn">Prova campana</button>
    </div>
  </div>

  <!-- TAB LUNA & PRECETTI (identica alla versione precedente) -->
  <div id="tab-moon" class="tab-panel">
    <div class="moon-phase-card" style="background: linear-gradient(135deg,#1A6B5A,#0E4F42); border-radius:24px; padding:20px; color:white; display:flex; gap:16px;">
      <div class="moon-icon" id="moonIcon" style="font-size:48px;">🌕</div>
      <div><h3 id="moonPhaseName">Luna piena</h3><p id="moonAdvice"></p></div>
    </div>
    <div class="card" id="moonPracticeCard"></div>
    <div class="card" id="preceptsCard" style="display:none;"><h3>📜 8 precetti</h3><div id="preceptsList"></div></div>
    <div class="card"><h4>📅 Prossimi giorni favorevoli</h4><div id="moonMilestones"></div></div>
  </div>

  <!-- TAB DIARIO (semplificata ma funzionale) -->
  <div id="tab-journal" class="tab-panel">
    <div class="card">
      <label>Prima della pratica</label>
      <div class="mood-buttons" style="display:flex; gap:8px; margin:8px 0;">
        <button class="mood-btn" data-mood="calmo">😌 Calmo</button>
        <button class="mood-btn" data-mood="stanco">😴 Stanco</button>
        <button class="mood-btn" data-mood="agitato">😤 Agitato</button>
      </div>
      <input type="hidden" id="moodBefore" value="calmo">
      <label>Dopo la pratica</label>
      <div class="mood-buttons" style="display:flex; gap:8px; margin:8px 0;">
        <button class="mood-after-btn" data-after="leggero">🕊️ Leggero</button>
        <button class="mood-after-btn" data-after="centrato">🎯 Centrato</button>
        <button class="mood-after-btn" data-after="calmo">😌 Calmo</button>
      </div>
      <input type="hidden" id="moodAfter" value="leggero">
      <textarea id="journalNote" rows="2" placeholder="Nota (opzionale)"></textarea>
      <button id="saveJournalBtn" class="btn-primary" style="margin-top:12px;">💾 Salva e completa pratica</button>
    </div>
    <div class="card"><h4>📋 Storico</h4><div id="sessionHistory"></div><button id="exportDataBtn" class="small-btn" style="margin-top:12px;">📤 Esporta</button></div>
  </div>
  <footer class="footer">NgalSo · v0.5 · Karaoke mantra e respiro</footer>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-content"><div id="modalMessage"></div><button class="close-modal">Chiudi</button></div></div>

<script>
  // ---------- STORAGE ----------
  const storage = {
    get(k, def=null) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e) { return def; } },
    set(k,v) { localStorage.setItem(k, JSON.stringify(v)); }
  };

  // ---------- DATI PRATICHE ----------
  const PRACTICE_STEPS_MORNING = [
    { title: "Rifugio", text: "NAMO GURU BYE · NAMO BUDDHAYA · NAMO DHARMAYA · NAMO SANGHAYA (3x)", mantra: "NAMO GURU BYE", reps: 3, meaning: "Mi rifugio nel Guru, nel Buddha, nel Dharma, nel Sangha. È il fondamento della pratica.", pronunciation: "nah-moh goo-roo bye, nah-moh boo-dah-yah..." },
    { title: "Bodhicitta", text: "Per il beneficio di tutti gli esseri, raggiungerò l'illuminazione.", mantra: "OM BODHICITTA HUNG", reps: 3, meaning: "Risveglio la mente compassionevole.", pronunciation: "om bo-dhi-chit-ta hung" },
    { title: "Mantra cuore", text: "Compassione universale.", mantra: "OM MANI PEME HUNG", reps: 21, meaning: "Il mantra di Avalokiteshvara, simbolo della compassione.", pronunciation: "om ma-ni pe-me hung" },
    { title: "Dedica", text: "Possa questo merito portare pace a tutti gli esseri.", mantra: "", reps: 0 }
  ];
  const PRACTICE_STEPS_EVENING = [
    { title: "Scarico", text: "Espira tensioni, inspira calma.", mantra: "OM AH HUNG", reps: 7, meaning: "Purifica corpo, parola e mente.", pronunciation: "om ah hung" },
    { title: "Purificazione elementi", text: "EH YAM RAM LAM BAM · HO SHUDDHE SHUDDHE SOHA", mantra: "EH YAM RAM LAM BAM HO SHUDDHE SHUDDHE SOHA", reps: 5, meaning: "Armonizza i 5 elementi interiori.", pronunciation: "e yam ram lam bam / ho sciud-de sciud-de so-ha" },
    { title: "Mantra cuore", text: "Lascia andare ciò che non serve.", mantra: "OM MANI PEME HUNG", reps: 21 },
    { title: "Dedica", text: "Che tutti gli esseri siano felici.", mantra: "", reps: 0 }
  ];
  const EMERGENCY_PRACTICES = {
    "1min": {
      name: "Scarico rapido", duration: 1,
      steps: [ { title: "Respiro OM AH HUNG", text: "Inspira OM, pausa AH, espira HUNG. 3 respiri lenti.", mantra: "OM AH HUNG", reps: 3, meaning: "Pulisce corpo, parola e mente in un istante.", pronunciation: "om ah hung" },
               { title: "Dedica lampo", text: "Che questa breve pausa porti chiarezza.", mantra: "", reps: 0 } ]
    },
    "2min": {
      name: "Ritorno al cuore", duration: 2,
      steps: [ { title: "Rifugio", text: "NAMO GURU BYE (1x)", mantra: "NAMO GURU BYE", reps: 1 },
               { title: "Mantra compassione", text: "OM MANI PEME HUNG a ritmo del respiro.", mantra: "OM MANI PEME HUNG", reps: 7, meaning: "Riaprire il cuore alla gentilezza.", pronunciation: "om ma-ni pe-me hung" },
               { title: "Dedica", text: "Che io e tutti gli esseri possiamo trovare pace ora.", mantra: "", reps: 0 } ]
    }
  };
  const MOON_PRACTICES = { new: { name:"8 precetti", duration:30, steps:[] }, first:{ name:"Disciplina", duration:15 }, full:{ name:"Precetti+dedica", duration:35 }, last:{ name:"Purificazione", duration:15 }, default:{ name:"NgalSo base", duration:7 } };
  const PRECEPTS_LIST = ["Non uccidere","Non rubare","Astinenza sessuale","Non mentire","No intossicanti","Non mangiare dopo mezzogiorno","No letti alti","No ornamenti/musica"];

  // stato globale
  let currentPractice = { type: "morning", duration:5, steps: PRACTICE_STEPS_MORNING, name:"Mattina" };
  let currentStep = 0, timerRemaining = 300, timerTotal = 300, timerRunning = false, timerInterval = null;
  let karaokeActive = false, karaokeInterval = null, currentRepetition = 0, targetRepetitions = 0, currentMantraText = "", currentLetterIndex = 0, currentStepDurationSec = 0, stepStartTime = 0;
  let currentMantraMeaning = "", currentMantraPron = "";

  // helper
  function toast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
  function playBell(kind) { try { let a = new Audio(`audio/${kind === 'start' ? 'bell-start' : 'bell-interval'}.mp3`); a.volume=0.5; a.play().catch(()=>{}); } catch(e){} }

  // aggiorna visuale timer
  function updateTimerDisplay() {
    let mins = Math.floor(timerRemaining/60), secs = timerRemaining%60;
    document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    let progress = (timerTotal - timerRemaining) / timerTotal;
    let offset = 653.45 * (1 - progress);
    document.getElementById('timerRingProgress').style.strokeDashoffset = offset;
  }

  // gestione karaoke (typewriter)
  function stopKaraoke() {
    if(karaokeInterval) clearInterval(karaokeInterval);
    karaokeActive = false;
    document.getElementById('mantraKaraokeArea').style.display = 'none';
  }
  function startKaraokeForStep(step) {
    if(!step.mantra || step.reps === 0) return;
    stopKaraoke();
    currentMantraText = step.mantra;
    targetRepetitions = step.reps;
    currentRepetition = 0;
    currentMantraMeaning = step.meaning || "Mantra di trasformazione";
    currentMantraPron = step.pronunciation || "Ascolta dal maestro";
    document.getElementById('targetReps').innerText = targetRepetitions;
    document.getElementById('currentRep').innerText = "0";
    document.getElementById('mantraKaraokeArea').style.display = 'block';
    // imposta il tempo a disposizione per questo step (durata in secondi)
    const stepDuration = (timerTotal / currentPractice.steps.length); // secondi totali per passo
    currentStepDurationSec = stepDuration;
    const timePerRepetition = stepDuration / targetRepetitions;
    const chars = currentMantraText.length;
    const intervalMs = (timePerRepetition * 1000) / chars;
    let currentChar = 0;
    let rep = 0;
    const karaokeDiv = document.getElementById('karaokeText');
    function updateKaraoke() {
      if(rep >= targetRepetitions) { stopKaraoke(); return; }
      let text = currentMantraText;
      let html = '';
      for(let i=0; i<text.length; i++) {
        let ch = text[i];
        if(i === currentChar) html += `<span class="highlight-letter">${ch}</span>`;
        else html += ch;
      }
      karaokeDiv.innerHTML = html;
      currentChar++;
      if(currentChar >= text.length) {
        // fine ripetizione
        currentChar = 0;
        rep++;
        currentRepetition = rep;
        document.getElementById('currentRep').innerText = rep;
        if(rep >= targetRepetitions) {
          stopKaraoke();
          // automaticamente passo successivo
          nextStep();
        } else {
          // ricomincia da capo
          updateKaraoke();
        }
      }
    }
    karaokeInterval = setInterval(() => {
      if(!timerRunning) return;
      updateKaraoke();
    }, intervalMs);
    karaokeActive = true;
    // avvia anche l'animazione respiro
    animateBreathing();
  }

  function animateBreathing() {
    const arrowSpan = document.getElementById('breathArrow');
    if(!arrowSpan) return;
    let direction = 1, val = 0;
    if(window.breathInterval) clearInterval(window.breathInterval);
    window.breathInterval = setInterval(() => {
      val += direction * 0.05;
      if(val >= 1) { direction = -1; arrowSpan.innerText = '↑'; }
      if(val <= 0) { direction = 1; arrowSpan.innerText = '↓'; }
      arrowSpan.style.transform = `translateY(${val * -12}px)`;
    }, 100);
  }

  function nextStep() {
    if(currentStep+1 < currentPractice.steps.length) {
      currentStep++;
      updateLiveGuide();
    } else {
      completePractice();
    }
  }

  function completePractice() {
    pauseTimer();
    playBell('start');
    const sessions = storage.get('ngalso_sessions',{});
    sessions[new Date().toISOString().split('T')[0]] = { completed:true, name:currentPractice.name };
    storage.set('ngalso_sessions', sessions);
    updateStreak(true);
    toast('✨ Pratica completata! ✨');
    resetTimer();
  }

  function updateLiveGuide() {
    const step = currentPractice.steps[currentStep];
    document.getElementById('stepCounter').innerText = `Passo ${currentStep+1}/${currentPractice.steps.length}`;
    document.getElementById('stepTitle').innerText = step.title;
    document.getElementById('stepText').innerText = step.text;
    // info mantra
    if(step.mantra && step.reps>0) {
      startKaraokeForStep(step);
    } else {
      stopKaraoke();
    }
    const next = currentPractice.steps[currentStep+1];
    document.getElementById('nextPreview').innerHTML = next ? `⏭️ Prossimo: ${next.title}` : '🎉 Ultimo passo';
  }

  function timerTick() {
    if(timerRemaining <= 0) { completePractice(); return; }
    timerRemaining--;
    updateTimerDisplay();
    // cambio step basato sul tempo (scorrimento automatico)
    let stepDuration = timerTotal / currentPractice.steps.length;
    let stepIndex = Math.floor((timerTotal - timerRemaining) / stepDuration);
    if(stepIndex !== currentStep && stepIndex < currentPractice.steps.length) {
      currentStep = stepIndex;
      updateLiveGuide();
    }
  }

  function startTimer() { if(timerRunning) return; timerRunning=true; if(document.getElementById('bellSelect').value !== 'silent') playBell('start'); timerInterval = setInterval(timerTick,1000); }
  function pauseTimer() { timerRunning=false; clearInterval(timerInterval); timerInterval=null; }
  function resetTimer() { pauseTimer(); timerRemaining = timerTotal; currentStep=0; updateTimerDisplay(); updateLiveGuide(); }
  function setPractice(type, duration, customSteps=null) {
    if(customSteps) currentPractice = { type, duration, steps:customSteps, name:customSteps[0]?.title || "Pratica" };
    else currentPractice = { type, duration, steps: type==='morning' ? PRACTICE_STEPS_MORNING : PRACTICE_STEPS_EVENING, name: type==='morning' ? 'Mattina' : 'Sera' };
    timerRemaining = duration*60; timerTotal = duration*60; currentStep=0; updateTimerDisplay(); updateLiveGuide(); pauseTimer();
    document.getElementById('timerPhaseLabel').innerText = `${currentPractice.name} · ${duration}min`;
    storage.set('ngalso_last_practice',{type,duration});
  }

  function updateStreak(save=false) { let sessions = storage.get('ngalso_sessions',{}); let streak=0; let d=new Date(); while(true){ let k=d.toISOString().split('T')[0]; if(sessions[k]?.completed) streak++; else break; d.setDate(d.getDate()-1); } document.getElementById('streakCount').innerText=streak; }

  // luna (semplificata)
  function renderMoonPanel() {
    let age = (Date.now() - Date.UTC(2000,0,6,18,14)) / 86400000 % 29.530588853;
    let phase = age<1.2?'new':(age<6.8?'waxing':(age<8.2?'first':(age<13.6?'gibbousWax':(age<16?'full':(age<21?'gibbousWane':(age<23?'last':'waning'))))));
    let p = { new:'🌑 Luna nuova', first:'🌓 Primo quarto', full:'🌕 Luna piena', last:'🌗 Ultimo quarto' }[phase] || '🌒 Altra fase';
    document.getElementById('moonPhaseName').innerHTML = p;
    document.getElementById('moonAdvice').innerHTML = phase==='new'||phase==='full'?'Oggi favorevole per i precetti':'Pratica NgalSo base';
    let preceptsDiv = document.getElementById('preceptsCard');
    if(phase==='new'||phase==='full') {
      preceptsDiv.style.display='block';
      document.getElementById('preceptsList').innerHTML = PRECEPTS_LIST.map(l=>`<div class="precept-item">${l}</div>`).join('');
    } else preceptsDiv.style.display='none';
    document.getElementById('moonPracticeCard').innerHTML = `<button class="btn-primary" id="moonStartBtn">🧘 Avvia pratica raccomandata</button>`;
    document.getElementById('moonStartBtn')?.addEventListener('click',()=>setPractice('morning', MOON_PRACTICES[phase]?.duration||7));
  }

  // diario
  function renderJournal() { let e=storage.get('ngalso_journal',[]); document.getElementById('sessionHistory').innerHTML = e.slice(0,10).map(e=>`<div class="session-item">${new Date(e.date).toLocaleDateString()} · ${e.moodBefore} → ${e.moodAfter}</div>`).join('') || '<div>Nessuna nota</div>'; }
  function saveJournal() { let moodBefore = document.getElementById('moodBefore').value; let moodAfter = document.getElementById('moodAfter').value; let note = document.getElementById('journalNote').value; let j=storage.get('ngalso_journal',[]); j.unshift({date:new Date().toISOString(), moodBefore, moodAfter, note, practice:currentPractice.name}); storage.set('ngalso_journal',j.slice(0,100)); renderJournal(); toast('Diario salvato'); document.getElementById('journalNote').value=''; }
  function exportData() { let data={sessions:storage.get('ngalso_sessions',{}), journal:storage.get('ngalso_journal',[])}; let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download=`ngalso_${new Date().toISOString().slice(0,10)}.json`; a.click(); }

  // modale info mantra
  function showMantraInfo() {
    let msg = `<strong>Pronuncia:</strong> ${currentMantraPron}<br><br><strong>Significato:</strong> ${currentMantraMeaning}`;
    document.getElementById('modalMessage').innerHTML = msg;
    document.getElementById('modal').classList.add('show');
  }
  document.querySelector('.close-modal')?.addEventListener('click', ()=>document.getElementById('modal').classList.remove('show'));

  // init eventi
  function init() {
    let last = storage.get('ngalso_last_practice',{type:'morning',duration:5});
    setPractice(last.type, last.duration);
    document.querySelectorAll('.preset-btn').forEach(btn=>btn.addEventListener('click',()=>{ let [t,d]=btn.dataset.preset.split('-'); setPractice(t,parseInt(d)); }));
    document.querySelectorAll('[data-emergency]').forEach(btn=>btn.addEventListener('click',()=>{ let key=btn.dataset.emergency; let em=EMERGENCY_PRACTICES[key]; if(em) setPractice('emergency', em.duration, em.steps); else toast('Pratica non trovata'); }));
    document.getElementById('startTimerBtn').onclick=startTimer;
    document.getElementById('pauseTimerBtn').onclick=pauseTimer;
    document.getElementById('resetTimerBtn').onclick=resetTimer;
    document.getElementById('testBellBtn').onclick=()=>playBell('start');
    document.getElementById('saveJournalBtn').onclick=saveJournal;
    document.getElementById('exportDataBtn').onclick=exportData;
    document.getElementById('mantraInfoBtn')?.addEventListener('click',showMantraInfo);
    document.querySelectorAll('.mood-btn').forEach(b=>b.addEventListener('click',()=>{ document.getElementById('moodBefore').value=b.dataset.mood; document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }));
    document.querySelectorAll('.mood-after-btn').forEach(b=>b.addEventListener('click',()=>{ document.getElementById('moodAfter').value=b.dataset.after; document.querySelectorAll('.mood-after-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }));
    document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{ let tab=b.dataset.tab; document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active')); document.getElementById(`tab-${tab}`).classList.add('active'); document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); if(tab==='moon') renderMoonPanel(); if(tab==='journal') renderJournal(); }));
    renderMoonPanel(); renderJournal(); updateStreak();
    setInterval(renderMoonPanel, 3600000);
    toast('🙏 Benvenuto – mantra a tempo e respiro guidato');
  }
  init();
</script>
</body>
</html>
